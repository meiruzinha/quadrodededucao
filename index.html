<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadro de Dedução</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="print.css">

</head>
<body>
<div class="page">
  <div class="layout" id="resolverLayout">
    <aside class="panel menu-panel">
      <h1 class="panel-title">Menu</h1>

      <nav class="menu-nav" aria-label="Seções do aplicativo">
        <button class="app-tab active" data-screen="resolver" type="button">🧩 Resolver</button>
        <button class="app-tab" data-screen="saved" type="button">📁 Casos</button>
      </nav>

      <div class="resolver-controls">
        <div class="note" id="levelNote">Quadro de dedução</div>

        <div class="menu-label">Quadro</div>
      <div class="level-tabs">
        <button class="level-tab active" data-level="pequeno" type="button">Básico / Médio</button>
        <button class="level-tab" data-level="grande" type="button">Muito difícil / Impossível</button>
      </div>

      <label class="field difficulty-field">
        Dificuldade do caso
        <select id="difficultySelect" aria-label="Dificuldade do caso"></select>
      </label>

      <label class="field">
        Caso
        <input id="caseName" type="text" placeholder="Nome do caso" autocomplete="off">
      </label>

      <div class="case-meta-grid">
        <label class="field">
          Livro
          <input id="bookName" type="text" placeholder="Ex.: Murdle Vol. 1" autocomplete="off">
        </label>

        <label class="field">
          Nº do caso
          <input id="caseNumber" type="text" inputmode="numeric" placeholder="Ex.: 23" autocomplete="off">
        </label>
      </div>

      <label class="field status-field">
        Status do caso
        <select id="caseStatus" aria-label="Status do caso">
          <option value="andamento">Em andamento</option>
          <option value="resolvido">Resolvido</option>
        </select>
      </label>

      <div class="btn-row">
        <button class="action primary" id="saveCase" type="button">Salvar</button>
        <button class="action" id="undoAction" type="button" disabled>↶ Desfazer</button>
        <button class="action" id="newCase" type="button">Novo</button>
        <button class="action warn" id="clearCase" type="button">Limpar</button>
        <button class="action print-action" id="printCase" type="button">🖨 Imprimir / PDF</button>
      </div>

      <div class="save-status" id="saveStatus" aria-live="polite"></div>

      <details class="notes-panel" id="notesDetails">
        <summary>📝 Pistas / Anotações</summary>
        <textarea id="caseNotes" rows="5" placeholder="Digite pistas, observações e raciocínios do caso..."></textarea>
      </details>

        <div id="editor"></div>
      </div>
    </aside>

    <div class="content-area">
      <main id="screen-resolver-inner" class="screen-inner active panel board-panel">
        <div class="board-caption" id="boardCaption"></div>
        <div class="board-scroll" id="boardScroll">
          <div id="board"></div>
        </div>
        <div class="scroll-hint" id="scrollHint">↔ Arraste para ver todo o quadro</div>
        <div class="hint">Clique para marcar ✕ ou ✓</div>

        <aside class="choice-panel" id="choicePanel">
          <div class="choice-toggle-row">
            <button class="choice-toggle" id="choiceToggle" type="button" aria-label="Fechar escolhas" title="Fechar escolhas">▶</button>
          </div>
          <div class="choice-groups" id="choiceGroups"></div>
        </aside>
      </main>

      <section id="screen-saved-inner" class="screen-inner panel saved-panel" hidden>
        <div class="saved-head">
          <div>
            <h1 class="panel-title">Casos</h1>
            <div class="note">Gerencie casos em andamento e resolvidos.</div>
          </div>
          <div class="saved-count" id="savedCount">0</div>
        </div>

        <div class="backup-row">
          <button class="action" id="exportBackup" type="button">Exportar backup</button>
          <button class="action" id="importBackup" type="button">Importar backup</button>
          <input id="backupFile" type="file" accept=".json,application/json" hidden>
        </div>

        <div class="saved-list" id="savedCasesList"></div>
      </section>
    </div>

    <button class="menu-arrow" id="menuToggle" type="button" aria-label="Fechar menu" title="Fechar menu">◀</button>
  </div>
</div>

  <footer class="site-footer">
    <div class="footer-line">
      <div class="footer-content">
        <span class="footer-year">© 2026</span>
        <a class="footer-author" href="https://www.instagram.com/yriemnelleh/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @yriemnelleh" title="@yriemnelleh">Y</a>
        <span class="footer-separator">—</span>
        <span class="footer-rights">Todos os direitos reservados.</span>
      </div>
    </div>
  </footer>


<section id="printSheet" class="print-sheet" aria-hidden="true">
  <header class="print-header">
    <div>
      <div class="print-kicker">Quadro de dedução</div>
      <h1 id="printCaseTitle">Caso</h1>
      <div id="printMeta" class="print-meta"></div>
    </div>
    <div id="printDifficulty" class="print-difficulty"></div>
  </header>

  <div id="printBoardArea" class="print-board-area"></div>

  <section class="print-choices-section">
    <h2>Escolhas</h2>
    <div id="printChoices" class="print-choices"></div>
  </section>

  <footer class="print-footer">
    <span>Quadro de dedução</span>
    <span>© 2026 Y — Todos os direitos reservados.</span>
  </footer>
</section>

<script src="app.js"></script>
</body>
</html>
